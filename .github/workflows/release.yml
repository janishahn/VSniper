name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/vsniper

jobs:
  publish:
    name: Build, publish and release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: vsniper:smoke
          provenance: false
          cache-from: type=gha

      - name: Smoke test image
        run: |
          docker run -d --name vsniper-smoke --network host vsniper:smoke
          for attempt in $(seq 60); do
            if curl -fsS http://127.0.0.1:8000/healthz && curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'; then
              break
            fi
            if [ "$attempt" = 60 ]; then docker logs vsniper-smoke; exit 1; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:6080/vnc.html
          docker exec vsniper-smoke python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              context = p.chromium.launch_persistent_context('/tmp/smoke-profile', executable_path='/usr/bin/chromium', headless=False)
              page = context.new_page()
              page.set_content('<title>ok</title>')
              assert page.title() == 'ok'
              context.close()
          "

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The release is created only after its image exists, so a host watching for new
      # releases never pulls a tag that is not published yet.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
