services:
  vsniper:
    image: ${VSNIPER_IMAGE:-ghcr.io/janishahn/vsniper:latest}
    build: .
    container_name: vsniper
    init: true
    restart: unless-stopped
    # Host networking keeps the loopback-only app and noVNC reachable by `tailscale serve`
    # without publishing a LAN port.
    network_mode: host
    environment:
      API_PORT: 8010
      VNC_PORT: 6080
    env_file:
      - path: .env
        required: false
    volumes:
      - vsniper_data:/data
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys, urllib.request; urllib.request.urlopen(sys.argv[1], timeout=3)' http://127.0.0.1:$$API_PORT/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  vsniper_data:
