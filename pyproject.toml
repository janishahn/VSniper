[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vsniper"
version = "0.4.4"
description = "Vinted listing discovery that learns your taste and alerts on Telegram"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "httpx>=0.27,<1.0",
  "pillow>=10.4,<12.0",
  "python-multipart>=0.0.9,<1.0",
  "tiktoken>=0.7,<1.0"
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.5,<1.0",
  "ty>=0.0.97",
]

[project.scripts]
dev = "vsniper.cli:dev"
fast-tests = "vsniper.cli:fast_tests"
scan-once = "vsniper.worker.scheduler:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vsniper = ["integrations/vinted/*.json"]
