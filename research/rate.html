<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rating round</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --card: #fff; --ink: #1c1b19; --mute: #77736b; --line: #e3e0d9; --like: #1f8a4c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161513; --card: #211f1c; --ink: #efece6; --mute: #9a958b; --line: #34312c; --like: #45c07a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.35 -apple-system, system-ui, sans-serif; }
  header { padding: 20px 20px 4px; max-width: 1500px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header p { margin: 4px 0 0; color: var(--mute); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; padding: 16px 20px 110px; max-width: 1500px; margin: 0 auto; }
  button.card { all: unset; box-sizing: border-box; display: block; cursor: pointer; background: var(--card); border-radius: 10px; overflow: hidden; position: relative; outline: 1px solid var(--line); transition: transform .12s ease-out; }
  button.card:active { transform: scale(.98); }
  button.card:focus-visible { outline: 2px solid var(--ink); }
  button.card img { display: block; width: 100%; aspect-ratio: 310 / 430; object-fit: cover; background: var(--line); }
  button.card .cap { padding: 7px 9px 8px; }
  button.card .brand { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button.card .meta { color: var(--mute); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button.card[aria-pressed=true] { outline: 3px solid var(--like); }
  button.card .mark { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: var(--like); color: #fff; display: grid; place-items: center; font-size: 15px; opacity: 0; transform: scale(.6); transition: opacity .12s, transform .12s ease-out; }
  button.card[aria-pressed=true] .mark { opacity: 1; transform: none; }
  footer { position: fixed; inset: auto 0 0 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
  footer div { max-width: 1500px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
  #status { color: var(--mute); margin-right: auto; font-variant-numeric: tabular-nums; }
  #finish { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 9px; border: 0; background: var(--ink); color: var(--bg); cursor: pointer; }
  #finish:disabled { opacity: .5; cursor: default; }
</style>
<header>
  <h1>Which of these would you want as an alert?</h1>
  <p>Click the ones you like. Everything you leave unmarked counts as a dislike when you finish.</p>
</header>
<main id="grid"></main>
<footer><div><span id="status"></span><button id="finish"></button></div></footer>
<script>
  const grid = document.getElementById("grid"), status = document.getElementById("status"), finish = document.getElementById("finish");
  let items = [], likes = new Set(), finished = false, error = false;

  function render() {
    const n = likes.size, rest = items.length - n;
    const counts = `${n} ${n === 1 ? "like" : "likes"}, ${rest} ${rest === 1 ? "dislike" : "dislikes"}`;
    status.textContent = error ? "Not saved. Is rate.py still running?" : finished ? `Finished: ${counts} saved` : `${n} liked of ${items.length}`;
    finish.textContent = finished ? "Finished" : `Finish with ${counts}`;
    finish.disabled = finished;
  }

  async function save() {
    render();
    try {
      const r = await fetch("/round", { method: "POST", body: JSON.stringify({ likes: [...likes], finished }) });
      error = !r.ok;
    } catch { error = true; }
    render();
  }

  fetch("/round").then(r => r.json()).then(data => {
    items = data.items; likes = new Set(data.likes); finished = data.finished;
    for (const it of items) {
      const card = document.createElement("button");
      card.className = "card"; card.title = it.title || "";
      card.setAttribute("aria-pressed", likes.has(it.item_id));
      const img = document.createElement("img"); img.src = `/img/${it.item_id}`; img.loading = "lazy"; img.alt = it.title || "";
      const cap = document.createElement("div"); cap.className = "cap";
      const brand = document.createElement("div"); brand.className = "brand"; brand.textContent = it.brand || "No brand";
      const meta = document.createElement("div"); meta.className = "meta";
      meta.textContent = [it.size, it.price != null ? `${Math.round(it.price)} €` : null].filter(Boolean).join(" · ");
      const mark = document.createElement("span"); mark.className = "mark"; mark.textContent = "♥";
      cap.append(brand, meta); card.append(img, cap, mark);
      card.onclick = () => {
        likes.has(it.item_id) ? likes.delete(it.item_id) : likes.add(it.item_id);
        card.setAttribute("aria-pressed", likes.has(it.item_id));
        finished = false; save();
      };
      grid.append(card);
    }
    render();
  });

  finish.onclick = () => { finished = true; save(); };
</script>
</html>
